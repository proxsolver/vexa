services:
  transcription-api:
    image: nginx:alpine
    container_name: transcription-lb-dev
    ports:
      - "8083:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - transcription-worker-1
    restart: unless-stopped
    networks:
      transcription-net:
      vexa-net:
        aliases:
          - transcription-service

  transcription-worker-1:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    container_name: transcription-worker-dev
    environment:
      - WORKER_ID=1
      - MODEL_SIZE=small
      - DEVICE=cpu
      - COMPUTE_TYPE=int8
      - CPU_THREADS=4
    volumes:
      - ./models:/app/models
    restart: unless-stopped
    networks:
      - transcription-net

networks:
  transcription-net:
    driver: bridge
  vexa-net:
    external: true
    name: vexa_vexa
